<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Bibliothèque Universitaire – Microservice</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
</head>
<body class="bg-light">

<div class="container my-4">
    <h2 class="text-center mb-4">📚 Bibliothèque Universitaire (Microservice)</h2>

    <!-- ================= Étudiants ================= -->
    <div class="card mb-4">
        <div class="card-header fw-bold">👨‍🎓 Étudiants (toutes universités)</div>
        <div class="card-body">
            <button class="btn btn-primary mb-2" onclick="chargerEtudiants()">Charger</button>
            <ul id="listeEtudiants" class="list-group"></ul>
        </div>
    </div>

    <!-- ================= Ouvrages ================= -->
    <div class="card mb-4">
        <div class="card-header fw-bold">📘 Ouvrages disponibles</div>
        <div class="card-body">
            <button class="btn btn-success mb-2" onclick="chargerOuvrages()">Charger</button>
            <ul id="listeOuvrages" class="list-group"></ul>
        </div>
    </div>

    <!-- ================= Emprunteurs ================= -->
    <div class="card mb-4">
        <div class="card-header fw-bold">📌 Étudiants ayant emprunté</div>
        <div class="card-body">
            <button class="btn btn-warning mb-2" onclick="chargerEmprunteurs()">Charger</button>
            <ul id="listeEmprunteurs" class="list-group"></ul>
        </div>
    </div>

    <!-- ================= Emprunt ================= -->
    <div class="card mb-4">
        <div class="card-header fw-bold">➕ Créer un emprunt distribué</div>
        <div class="card-body">
            <form onsubmit="creerEmprunt(event)">
                <div class="row mb-2">
                    <div class="col">
                        <select id="universite" class="form-select" required>
                            <option value="">Université de l’étudiant</option>
                            <option value="UGB">UGB</option>
                            <option value="UAD">UAD</option>
                        </select>
                    </div>
                    <div class="col">
                        <select id="selectEtudiant" class="form-select" required></select>
                    </div>
                    <div class="col">
                        <select id="selectOuvrage" class="form-select" required></select>
                    </div>
                    <div class="col">
                        <input type="date" id="dateEmprunt" class="form-control" required>
                    </div>
                </div>
                <button class="btn btn-dark">Créer l’emprunt</button>
            </form>
            <div id="resultatEmprunt" class="mt-2"></div>
        </div>
    </div>
</div>

<script>
const API = "http://localhost:5000";

// ================= Chargement des listes =================
function chargerSelects() {
    // Étudiants
    fetch(`${API}/etudiants`)
        .then(r => r.json())
        .then(data => {
            const s = document.getElementById("selectEtudiant");
            s.innerHTML = "<option value=''>Choisir étudiant</option>";
            data.forEach(e => {
                s.innerHTML += `
                  <option value="${e.idEtud}">
                    ${e.nom} (${e.universite_origine}) – emprunts: ${e.nbreEmprunts}
                  </option>`;
            });
        });

    // Ouvrages (clé composée idOuv + site)
    fetch(`${API}/ouvrages`)
        .then(r => r.json())
        .then(data => {
            const s = document.getElementById("selectOuvrage");
            s.innerHTML = "<option value=''>Choisir ouvrage</option>";
            data.forEach(o => {
                s.innerHTML += `
                  <option value="${o.idOuv}" data-site="${o.site}">
                    ${o.titre} [${o.site}] – stock: ${o.stock}
                  </option>`;
            });
        });
}

// ================= Étudiants =================
function chargerEtudiants() {
    fetch(`${API}/etudiants`)
        .then(r => r.json())
        .then(data => {
            const ul = document.getElementById("listeEtudiants");
            ul.innerHTML = "";
            data.forEach(e => {
                ul.innerHTML += `
                    <li class="list-group-item">
                        ${e.nom} (${e.universite_origine}) — Emprunts : ${e.nbreEmprunts}
                    </li>`;
            });
        });
}

// ================= Ouvrages =================
function chargerOuvrages() {
    fetch(`${API}/ouvrages`)
        .then(r => r.json())
        .then(data => {
            const ul = document.getElementById("listeOuvrages");
            ul.innerHTML = "";
            data.forEach(o => {
                ul.innerHTML += `
                    <li class="list-group-item">
                        ${o.titre} [${o.site}] — Stock : ${o.stock}
                    </li>`;
            });
        });
}

// ================= Emprunteurs =================
function chargerEmprunteurs() {
    fetch(`${API}/etudiants/emprunteurs`)
        .then(r => r.json())
        .then(data => {
            const ul = document.getElementById("listeEmprunteurs");
            ul.innerHTML = "";
            data.forEach(e => {
                ul.innerHTML += `
                    <li class="list-group-item">
                        ${e.nom} (${e.universite_origine})
                    </li>`;
            });
        });
}

// ================= Emprunt =================
function creerEmprunt(event) {
    event.preventDefault();

    const selectOuvrage = document.getElementById("selectOuvrage");
    const siteOuvrage = selectOuvrage.selectedOptions[0].dataset.site;

    const payload = {
        universite: document.getElementById("universite").value,
        idEtud: document.getElementById("selectEtudiant").value,
        idOuv: document.getElementById("selectOuvrage").value,
        siteOuvrage: siteOuvrage,
        date_emprunt: document.getElementById("dateEmprunt").value
    };

    fetch(`${API}/emprunt`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    })
    .then(r => r.json())
    .then(data => {
        document.getElementById("resultatEmprunt").innerHTML =
            `<div class="alert alert-info">${JSON.stringify(data)}</div>`;
        chargerSelects();
    });
}

document.addEventListener("DOMContentLoaded", chargerSelects);
</script>

</body>
</html>
