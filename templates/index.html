<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibliothèque Universitaire</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tab {
            flex: 1;
            min-width: 150px;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            color: #666;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .tab:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: translateY(-2px);
        }

        .content {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: none;
        }

        .content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-title {
            font-size: 1.8em;
            color: #667eea;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button.btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        button.btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        button.btn:active {
            transform: translateY(0);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            border-left: 4px solid #667eea;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .card h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .card p {
            color: #666;
            margin: 5px 0;
        }

        .university-section {
            margin-bottom: 30px;
        }

        .university-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 1.3em;
            font-weight: 600;
        }

        .message {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2em;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Bibliothèque Universitaire</h1>
            <p class="subtitle">Système de gestion des emprunts UGB & UAD</p>
        </header>

        <div class="tabs">
            <button class="tab active" onclick="showTab('etudiants')">👥 Étudiants</button>
            <button class="tab" onclick="showTab('emprunts')">📖 Emprunts</button>
            <button class="tab" onclick="showTab('nouveau')">➕ Nouvel Emprunt</button>
            <button class="tab" onclick="showTab('verification')">✓ Vérification</button>
            <button class="tab" onclick="showTab('disponibles')">📚 Ouvrages Disponibles</button>
        </div>

        <!-- Onglet Étudiants -->
        <div id="etudiants" class="content active">
            <h2 class="section-title">👥 Liste des Étudiants</h2>
            <button class="btn" onclick="loadEtudiants()">Actualiser</button>
            <div id="etudiants-list"></div>
        </div>

        <!-- Onglet Emprunts -->
        <div id="emprunts" class="content">
            <h2 class="section-title">📖 Tous les Emprunts</h2>
            <button class="btn" onclick="loadEmprunts()">Actualiser</button>
            <div id="emprunts-list"></div>
        </div>

        <!-- Onglet Nouvel Emprunt -->
        <div id="nouveau" class="content">
            <h2 class="section-title">➕ Créer un Nouvel Emprunt</h2>
            <div id="nouveau-message"></div>
            <form onsubmit="creerEmprunt(event)">
                <div class="form-group">
                    <label>Université</label>
                    <select id="new-universite" required>
                        <option value="">Sélectionnez une université</option>
                        <option value="UGB">UGB</option>
                        <option value="UAD">UAD</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>ID Étudiant</label>
                    <input type="number" id="new-idEtud" required>
                </div>
                <div class="form-group">
                    <label>ID Ouvrage</label>
                    <input type="number" id="new-idOuv" required>
                </div>
                <div class="form-group">
                    <label>Date d'emprunt</label>
                    <input type="date" id="new-dateEmprunt" required>
                </div>
                <button type="submit" class="btn">Créer l'emprunt</button>
            </form>
        </div>

        <!-- Onglet Vérification -->
        <div id="verification" class="content">
            <h2 class="section-title">✓ Vérifier un Étudiant</h2>
            <div id="verif-message"></div>
            <form onsubmit="verifierEtudiant(event)">
                <div class="form-group">
                    <label>ID Étudiant</label>
                    <input type="number" id="verif-idEtud" required>
                </div>
                <button type="submit" class="btn">Vérifier</button>
            </form>
            <div id="verif-result"></div>
        </div>

        <!-- Onglet Ouvrages Disponibles -->
        <div id="disponibles" class="content">
            <h2 class="section-title">📚 Ouvrages Disponibles</h2>
            <button class="btn" onclick="loadDisponibles()">Actualiser</button>
            <div id="disponibles-list"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:5000';

        function showTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');

            // Auto-charger les données selon l'onglet
            if (tabName === 'etudiants') loadEtudiants();
            if (tabName === 'emprunts') loadEmprunts();
            if (tabName === 'disponibles') loadDisponibles();
        }

        async function loadEtudiants() {
            const container = document.getElementById('etudiants-list');
            container.innerHTML = '<div class="loading"><div class="spinner"></div>Chargement...</div>';

            try {
                const response = await fetch(`${API_URL}/etudiants`);
                const data = await response.json();

                let html = '';
                for (const [univ, etudiants] of Object.entries(data)) {
                    html += `<div class="university-section">
                        <div class="university-header">${univ}</div>
                        <div class="grid">`;
                    
                    if (etudiants.length === 0) {
                        html += '<div class="empty-state">Aucun étudiant</div>';
                    } else {
                        etudiants.forEach(e => {
                            html += `<div class="card">
                                <h3>ID: ${e.idEtud}</h3>
                                <p><strong>Nom:</strong> ${e.nom}</p>
                                <p><strong>Prénom:</strong> ${e.prenom}</p>
                            </div>`;
                        });
                    }
                    html += `</div></div>`;
                }
                container.innerHTML = html;
            } catch (error) {
                container.innerHTML = `<div class="message error">Erreur: ${error.message}</div>`;
            }
        }

        async function loadEmprunts() {
            const container = document.getElementById('emprunts-list');
            container.innerHTML = '<div class="loading"><div class="spinner"></div>Chargement...</div>';

            try {
                const response = await fetch(`${API_URL}/emprunts`);
                const data = await response.json();

                let html = '';
                for (const [univ, emprunts] of Object.entries(data)) {
                    html += `<div class="university-section">
                        <div class="university-header">${univ}</div>
                        <div class="grid">`;
                    
                    if (emprunts.length === 0) {
                        html += '<div class="empty-state">Aucun emprunt</div>';
                    } else {
                        emprunts.forEach(e => {
                            html += `<div class="card">
                                <h3>Emprunt #${e.idPret || 'N/A'}</h3>
                                <p><strong>Étudiant:</strong> ${e.idEtud}</p>
                                <p><strong>Ouvrage:</strong> ${e.idOuv}</p>
                                <p><strong>Date:</strong> ${e.dateEmprunt}</p>
                            </div>`;
                        });
                    }
                    html += `</div></div>`;
                }
                container.innerHTML = html;
            } catch (error) {
                container.innerHTML = `<div class="message error">Erreur: ${error.message}</div>`;
            }
        }

        async function creerEmprunt(e) {
            e.preventDefault();
            const messageDiv = document.getElementById('nouveau-message');

            const data = {
                universite: document.getElementById('new-universite').value,
                idEtud: parseInt(document.getElementById('new-idEtud').value),
                idOuv: parseInt(document.getElementById('new-idOuv').value),
                dateEmprunt: document.getElementById('new-dateEmprunt').value
            };

            try {
                const response = await fetch(`${API_URL}/emprunt`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                
                if (response.ok) {
                    messageDiv.innerHTML = '<div class="message success">✓ Emprunt créé avec succès!</div>';
                    e.target.reset();
                } else {
                    messageDiv.innerHTML = `<div class="message error">Erreur: ${JSON.stringify(result)}</div>`;
                }
            } catch (error) {
                messageDiv.innerHTML = `<div class="message error">Erreur: ${error.message}</div>`;
            }
        }

        async function verifierEtudiant(e) {
            e.preventDefault();
            const messageDiv = document.getElementById('verif-message');
            const resultDiv = document.getElementById('verif-result');
            const idEtud = document.getElementById('verif-idEtud').value;

            resultDiv.innerHTML = '<div class="loading"><div class="spinner"></div>Vérification...</div>';

            try {
                const response = await fetch(`${API_URL}/emprunt/verifier/${idEtud}`);
                const data = await response.json();

                if (data.autorise) {
                    resultDiv.innerHTML = `<div class="message success">✓ ${data.message}</div>`;
                } else {
                    resultDiv.innerHTML = `<div class="message error">✗ ${data.message}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="message error">Erreur: ${error.message}</div>`;
            }
        }

        async function loadDisponibles() {
            const container = document.getElementById('disponibles-list');
            container.innerHTML = '<div class="loading"><div class="spinner"></div>Chargement...</div>';

            try {
                const response = await fetch(`${API_URL}/ouvrages/disponibles`);
                const data = await response.json();

                let html = '';
                for (const [univ, ouvrages] of Object.entries(data)) {
                    html += `<div class="university-section">
                        <div class="university-header">${univ}</div>
                        <div class="grid">`;
                    
                    if (ouvrages.length === 0) {
                        html += '<div class="empty-state">Aucun ouvrage disponible</div>';
                    } else {
                        ouvrages.forEach(o => {
                            html += `<div class="card">
                                <h3>${o.titre || 'Sans titre'}</h3>
                                <p><strong>ID:</strong> ${o.idOuv}</p>
                                <p><strong>Auteur:</strong> ${o.auteur || 'N/A'}</p>
                            </div>`;
                        });
                    }
                    html += `</div></div>`;
                }
                container.innerHTML = html;
            } catch (error) {
                container.innerHTML = `<div class="message error">Erreur: ${error.message}</div>`;
            }
        }

        // Charger les étudiants au démarrage
        loadEtudiants();
    </script>
</body>
</html>
